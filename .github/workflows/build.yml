name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  protocol:
    name: Protocol tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # ANDROID_HOME is cleared on purpose. The ubuntu runner ships an Android
      # SDK and exports it, which would pull :app into this build; blanking it
      # exercises the path a contributor with only a JDK actually takes, and
      # proves the transport stands on its own.
      - run: ./gradlew :protocol:test
        env:
          ANDROID_HOME: ""
          ANDROID_SDK_ROOT: ""
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: protocol-test-report
          path: protocol/build/reports/tests/test

  apk:
    name: Debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: offlineshare-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Lint runs after the APK so a style finding never costs us the build
      # artifact; it still reports, it just does not gate.
      - name: Lint
        continue-on-error: true
        run: ./gradlew :app:lintDebug
      - name: Upload lint report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
