name: Build

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  protocol:
    name: Protocol tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # No Android SDK step on purpose: settings.gradle.kts drops :app when
      # there is no SDK, so this job proves the transport builds and its
      # end-to-end transfers pass on a plain JDK.
      - run: ./gradlew :protocol:test

  app:
    name: Android app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :app:assembleDebug :app:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: offlineshare-debug
          path: app/build/outputs/apk/debug/*.apk
