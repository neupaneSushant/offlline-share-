name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  protocol:
    name: Protocol tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # No Android SDK step on purpose: settings.gradle.kts drops :app when
      # there is no SDK, so this job proves the transport builds and its
      # end-to-end transfers pass on a plain JDK.
      - run: ./gradlew :protocol:test
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: protocol-test-report
          path: protocol/build/reports/tests/test

  apk:
    name: Debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: offlineshare-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Lint runs after the APK so a style finding never costs us the build
      # artifact; it still reports, it just does not gate.
      - name: Lint
        continue-on-error: true
        run: ./gradlew :app:lintDebug
      - name: Upload lint report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
