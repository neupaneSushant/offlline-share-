name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  protocol:
    name: Protocol tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # ANDROID_HOME is cleared on purpose. The ubuntu runner ships an Android
      # SDK and exports it, which would pull :app into this build; blanking it
      # exercises the path a contributor with only a JDK actually takes, and
      # proves the transport stands on its own.
      - run: ./gradlew :protocol:test
        env:
          ANDROID_HOME: ""
          ANDROID_SDK_ROOT: ""
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: protocol-test-report
          path: protocol/build/reports/tests/test

  apk:
    name: Debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # packages: '' is load-bearing. The action's default is
      # "tools platform-tools", and Google retired the `tools` package, so
      # sdkmanager exits 1 with "Failed to find package 'tools'" and the job
      # dies before Gradle starts. The runner image already ships an SDK with
      # licences accepted; this step only needs to point at it, and AGP pulls
      # down the platform and build-tools it wants.
      - uses: android-actions/setup-android@v3
        with:
          packages: ""

      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: offlineshare-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Lint runs after the APK so a finding never costs us the build
      # artifact, but it does gate the job: continue-on-error made a failing
      # lint step report success, which hid a real manifest error.
      - name: Lint
        run: ./gradlew :app:lintDebug

      # Lint stops at the first error, so the console summary hides the rest.
      # Dump the full text report either way.
      - name: Show lint report
        if: always()
        continue-on-error: true
        run: |
          find app/build -name 'lint-results-debug.txt' -print -exec cat {} \; || true
      - name: Upload lint report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
