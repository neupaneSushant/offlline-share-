# Required. Every dependency here is AndroidX, and AGP fails the build
# outright if this is not set rather than guessing.
android.useAndroidX=true

# No support-library artifacts anywhere in the graph, so there is nothing to
# rewrite. Leaving Jetifier on would cost a slow transform over every jar.
android.enableJetifier=false

# Each module's R class carries only its own resources instead of inlining
# every dependency's. Smaller R classes, faster incremental builds.
android.nonTransitiveRClass=true

# The default 512m metaspace is not enough for AGP plus the Kotlin and Compose
# compiler plugins; the build dies with an OutOfMemoryError partway through.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

org.gradle.parallel=true
org.gradle.caching=true

kotlin.code.style=official
